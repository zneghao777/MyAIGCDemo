[project]
name = "cineai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "celery[redis]>=5.4,<6", "redis>=5,<7", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "boto3>=1.36,<2", "pillow>=11", "prometheus-client>=0.21", "structlog>=25"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "aiosqlite>=0.20", "ruff>=0.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
